[project]
name = "open-timeline-engine"
version = "0.4.0"
description = "Local-first timeline context engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Open Timeline Engine Contributors" }]
license = { text = "Apache-2.0" }
dependencies = []

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/eval/harness/*.py" = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["services/tce_api", "services/tce_worker", "services/tce_mcp", "services/tce_lite_api", "services/tce_supervisor", "shared"]
testpaths = ["tests"]
markers = [
  "e2e: requires a live Full PostgreSQL stack and MCP transport",
  "integration: requires an API integration environment",
  "subprocess: spawns a real process; exempt from the tests/conftest.py _no_subprocess guard",
  "network: connects off-loopback; exempt from the tests/conftest.py _no_socket guard",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = "(^|/)(build|dist|node_modules|\\.venv)/|^tests/eval/harness/"

[[tool.mypy.overrides]]
module = ["tce_10k_retrieval_eval", "tests.eval.harness.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# locust is an optional load-test dependency, installed only in the load-tests CI
# job, so the type-check job cannot resolve it — treat it as untyped there.
module = ["requests", "requests.*", "pgvector", "pgvector.*", "locust", "locust.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgvector.sqlalchemy"]
ignore_missing_imports = true
