version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /shared
      - /services/tce_api
      - /services/tce_lite_api
      - /services/tce_mcp
      - /services/tce_worker
      - /plugins/tce_cli_capture
      - /plugins/tce_git_capture
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
