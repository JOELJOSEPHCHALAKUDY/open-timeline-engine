[project]
name = "tce-shared"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "requests>=2.33,<3",
  "httpx>=0.27,<1"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tce_shared", "tce_model_gateway", "ote_advisor_providers"]
