[project]
name = "tce-lite-api"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.112,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "httpx>=0.27,<1"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
