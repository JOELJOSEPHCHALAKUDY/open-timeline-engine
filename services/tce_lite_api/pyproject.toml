[project]
name = "tce-lite-api"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139.2,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "starlette>=1.3.1,<2",
  "prometheus-client>=0.20,<1",
  "httpx>=0.27,<1"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
