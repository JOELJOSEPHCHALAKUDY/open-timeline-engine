[project]
name = "tce-supervisor"
version = "0.4.0"
description = "The TCE dispatch supervisor: a separate host process that runs a mutating agent under a measured sandbox."
requires-python = ">=3.12"
# Deliberately NO sqlalchemy, psycopg or redis. The supervisor holds a narrow HTTP
# credential and never touches the enforcement database or the Docker socket the
# manager holds (design §3.1, §3.3). tests/unit/test_supervisor_startup.py asserts it.
dependencies = [
  "requests>=2.33,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.14.2,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tce_supervisor*"]

[tool.setuptools.package-data]
tce_supervisor = ["profiles/*.sb", "adapters/contracts/*"]
