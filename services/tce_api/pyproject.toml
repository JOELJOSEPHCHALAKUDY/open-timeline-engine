[project]
name = "tce-api"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139.2,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.14.2,<3",
  "starlette>=1.3.1,<2",
  "sqlalchemy>=2.0.32,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<6",
  "rq>=1.16,<2",
  "pgvector>=0.2.5,<1",
  "prometheus-client>=0.20,<1",
  "python-json-logger>=2.0,<3",
  "opentelemetry-api>=1.26,<2",
  "opentelemetry-sdk>=1.26,<2",
  "httpx>=0.27,<1",
  "requests>=2.33,<3",
  "openai>=1.30,<2",
  "anthropic>=0.34,<1",
  "keyring>=25.3,<26",
  "typer>=0.27.0,<1",
  "alembic>=1.13,<2"
]

[project.scripts]
tce-tokenctl = "tce_api.token_cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
