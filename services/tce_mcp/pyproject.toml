[project]
name = "tce-mcp"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "requests>=2.33,<3",
  "starlette>=1.3.1,<2",
  "python-multipart>=0.0.31,<1",
  "opentelemetry-api>=1.26,<2",
  "opentelemetry-sdk>=1.26,<2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
