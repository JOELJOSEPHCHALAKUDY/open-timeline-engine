[project]
name = "tce-mcp"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "requests>=2.32,<3",
  "opentelemetry-api>=1.26,<2",
  "opentelemetry-sdk>=1.26,<2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
