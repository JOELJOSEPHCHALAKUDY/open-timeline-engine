[project]
name = "tce-worker"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy>=2.0.32,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<6",
  "rq>=1.16,<2",
  "pgvector>=0.2.5,<1",
  "requests>=2.33,<3",
  "opentelemetry-api>=1.26,<2",
  "opentelemetry-sdk>=1.26,<2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
