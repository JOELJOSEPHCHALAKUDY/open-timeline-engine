name: open-timeline-engine-lite

services:
  tce-lite-api:
    build:
      context: ..
      dockerfile: services/tce_lite_api/Dockerfile
    env_file:
      - ../.env
    environment:
      TCE_LITE_DB_PATH: /data/tce-lite.db
      TCE_BEHAVIOR_EVIDENCE_ENABLED: ${TCE_BEHAVIOR_EVIDENCE_ENABLED:-true}
      TCE_BEHAVIOR_FIDELITY_ENABLED: ${TCE_BEHAVIOR_FIDELITY_ENABLED:-true}
      TCE_BEHAVIOR_PROJECTIONS_ENABLED: ${TCE_BEHAVIOR_PROJECTIONS_ENABLED:-false}
      TCE_BEHAVIOR_PROJECTION_PILOT_ENABLED: ${TCE_BEHAVIOR_PROJECTION_PILOT_ENABLED:-false}
      TCE_BEHAVIOR_PREDICTION_ENABLED: ${TCE_BEHAVIOR_PREDICTION_ENABLED:-true}
      TCE_BEHAVIOR_CALIBRATION_ENABLED: ${TCE_BEHAVIOR_CALIBRATION_ENABLED:-false}
      TCE_BEHAVIOR_AUTONOMY_GATE_ENABLED: ${TCE_BEHAVIOR_AUTONOMY_GATE_ENABLED:-false}
      TCE_BEHAVIOR_STORAGE_GATE_MODE: ${TCE_BEHAVIOR_STORAGE_GATE_MODE:-shadow}
      TCE_WORKSPACE_ACCESS_MODE: ${TCE_WORKSPACE_ACCESS_MODE:-compat}
      TCE_AUDIT_WRITE_MODE: ${TCE_AUDIT_WRITE_MODE:-durable}
      TCE_BEHAVIOR_SUBJECT_BINDINGS: ${TCE_BEHAVIOR_SUBJECT_BINDINGS:-}
      TCE_BEHAVIOR_CAPABILITY_BROKER_ENABLED: ${TCE_BEHAVIOR_CAPABILITY_BROKER_ENABLED:-true}
      TCE_BEHAVIOR_PROCESS_MINING_ENABLED: ${TCE_BEHAVIOR_PROCESS_MINING_ENABLED:-true}
      TCE_BEHAVIOR_SHADOW_EVALUATION_ENABLED: ${TCE_BEHAVIOR_SHADOW_EVALUATION_ENABLED:-true}
      TCE_BEHAVIOR_MEMORY_REVIEW_ENABLED: ${TCE_BEHAVIOR_MEMORY_REVIEW_ENABLED:-true}
      TCE_BEHAVIOR_COUNTERFACTUAL_ENABLED: ${TCE_BEHAVIOR_COUNTERFACTUAL_ENABLED:-true}
      TCE_BEHAVIOR_PROCESS_MIN_SUPPORT: ${TCE_BEHAVIOR_PROCESS_MIN_SUPPORT:-2}
      TCE_CAPABILITY_GRANT_TTL_SECONDS: ${TCE_CAPABILITY_GRANT_TTL_SECONDS:-120}
      TCE_BEHAVIOR_CONTROL_RETENTION_DAYS: ${TCE_BEHAVIOR_CONTROL_RETENTION_DAYS:-365}
    ports:
      - "${TCE_API_PORT:-8080}:8080"
    volumes:
      - tce_lite_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  tce-mcp:
    build:
      context: ..
      dockerfile: services/tce_mcp/Dockerfile
    env_file:
      - ../.env
    environment:
      TCE_API_BASE_URL: http://tce-lite-api:8080
      TCE_API_TOKEN: ${TCE_API_TOKEN:-local-dev-token}
      TCE_MCP_CONSUMER_ID: ${TCE_MCP_EXECUTOR_CONSUMER_ID:-codex-executor}
      TCE_MCP_ROLE: executor
      TCE_MCP_WORKSPACE_ID: ${TCE_MCP_WORKSPACE_ID:-personal}
      TCE_MCP_USER_ID: ${TCE_MCP_EXECUTOR_USER_ID:-codex-executor}
      TCE_MCP_BEHAVIOR_SUBJECT_ID: ${TCE_BEHAVIOR_SUBJECT_ID:-local-user}
    depends_on:
      tce-lite-api:
        condition: service_healthy

  tce-mcp-secondary:
    build:
      context: ..
      dockerfile: services/tce_mcp/Dockerfile
    env_file:
      - ../.env
    environment:
      TCE_API_BASE_URL: http://tce-lite-api:8080
      TCE_API_TOKEN: ${TCE_API_TOKEN:-local-dev-token}
      TCE_MCP_CONSUMER_ID: ${TCE_MCP_SECONDARY_CONSUMER_ID:-claude-executor}
      TCE_MCP_ROLE: executor
      TCE_MCP_WORKSPACE_ID: ${TCE_MCP_WORKSPACE_ID:-personal}
      TCE_MCP_USER_ID: ${TCE_MCP_SECONDARY_USER_ID:-claude-executor}
      TCE_MCP_BEHAVIOR_SUBJECT_ID: ${TCE_BEHAVIOR_SUBJECT_ID:-local-user}
      TCE_MCP_SESSION_ID: ${TCE_MCP_SECONDARY_SESSION_ID:-claude}
    depends_on:
      tce-lite-api:
        condition: service_healthy

volumes:
  tce_lite_data:
