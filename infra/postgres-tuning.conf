# TCE PostgreSQL tuning for local dev (64GB host, SSD)
# Mount as: -v ./postgres-tuning.conf:/etc/postgresql/conf.d/tuning.conf:ro

# Memory — 128MB default is far too low
shared_buffers = 1GB
work_mem = 16MB
maintenance_work_mem = 256MB
effective_cache_size = 4GB

# Planner — SSD/NVMe cost model
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL — relax durability for dev workloads (audit logs, interaction captures)
synchronous_commit = off
wal_buffers = 64MB
checkpoint_completion_target = 0.9

# Connections
max_connections = 100
